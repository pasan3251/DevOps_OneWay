version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: waypoint_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-waypoint_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-waypoint_secure_pass}
      POSTGRES_DB: ${DATABASE_NAME:-waypoint_db}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - waypoint_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-waypoint_user} -d ${DATABASE_NAME:-waypoint_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.22.1
    container_name: waypoint_pgbouncer
    restart: unless-stopped
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    environment:
      DB_USER: ${DATABASE_USER:-waypoint_user}
      DB_PASSWORD: ${DATABASE_PASSWORD:-waypoint_secure_pass}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DATABASE_NAME:-waypoint_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 250
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      AUTH_TYPE: plain
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: waypoint_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - waypoint_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: waypoint_api
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${DATABASE_USER:-waypoint_user}:${DATABASE_PASSWORD:-waypoint_secure_pass}@postgres:5432/${DATABASE_NAME:-waypoint_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_signing_key_at_least_64_characters_long_for_hs512_security}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_jwt_key_different_from_access_secret_entropy}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      COOKIE_SECRET: ${COOKIE_SECRET:-secure_fastify_cookie_secret_salt_32_chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  waypoint_pgdata:
  waypoint_redisdata:
