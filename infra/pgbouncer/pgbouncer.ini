[databases]
waypoint_db = host=postgres port=5432 dbname=waypoint_db auth_user=waypoint_user

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

# Transaction pooling mode: Optimal for high-concurrency stateless APIs
pool_mode = transaction

# Maximum client connections to PgBouncer
max_client_conn = 250

# Server connections multiplexed to PostgreSQL
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5.0
max_db_connections = 40

# Timeouts & Keepalives
server_idle_timeout = 600.0
client_idle_timeout = 0.0
query_timeout = 15.0
connection_lifetime = 3600.0

# Security and Logging
admin_users = waypoint_admin
stats_users = waypoint_monitor
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
